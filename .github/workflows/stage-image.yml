name: Stage image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build.
        required: false
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: stage-image-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve ref and image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      sha:   ${{ steps.image.outputs.sha }}
      image: ${{ steps.image.outputs.image }}
      tag:   ${{ steps.image.outputs.tag }}
    steps:
      - name: Refuse to run in the upstream fabro-sh repository
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$REPOSITORY_OWNER" = "fabro-sh" ]; then
            echo "::error::stage-image.yml must not run in the fabro-sh repository; it would publish under ghcr.io/fabro-sh/" >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compute the resolved commit, image name, and tag
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lower=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner_lower}/fabro"
          case "$image" in
            ghcr.io/fabro-sh/*)
              echo "::error::refusing to publish under ghcr.io/fabro-sh/" >&2
              exit 1
              ;;
          esac
          sha=$(git rev-parse HEAD)
          sha12=$(printf '%s' "$sha" | cut -c1-12)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=stage-${sha12}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Refuse to run in the upstream fabro-sh repository
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$REPOSITORY_OWNER" = "fabro-sh" ]; then
            echo "::error::stage-image.yml must not run in the fabro-sh repository; it would publish under ghcr.io/fabro-sh/" >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space (the zig/docker build needs headroom on the hosted runner)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install unzip (ARM Linux runner image lacks it; setup-bun needs it)
        if: runner.arch == 'ARM64'
        run: sudo apt-get update && sudo apt-get install -y unzip

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install bun deps
        run: bun install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.97.1

      - name: Build the fabro binary for linux/${{ matrix.arch }} (cargo dev docker-build, embedded web UI included)
        run: |
          ulimit -n 4096
          cargo --locked dev docker-build --arch ${{ matrix.arch }} --compile-only

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.resolve.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Refuse to run in the upstream fabro-sh repository
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$REPOSITORY_OWNER" = "fabro-sh" ]; then
            echo "::error::stage-image.yml must not run in the fabro-sh repository; it would publish under ghcr.io/fabro-sh/" >&2
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: stage-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create -t "${IMAGE}:${TAG}" "${refs[@]}"

      - name: Verify the published manifest lists both architectures
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          raw=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --raw)
          for arch in amd64 arm64; do
            printf '%s' "$raw" | jq -e --arg a "$arch" \
              '.manifests[] | select(.platform.os=="linux" and .platform.architecture==$a)' >/dev/null \
              || { echo "::error::${IMAGE}:${TAG} is missing linux/${arch}" >&2; exit 1; }
          done
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

      - name: Publish the tag to the job summary
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: echo "Published \`${IMAGE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
